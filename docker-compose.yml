services:
  db:
    image: postgres:16
    container_name: proyecto3_db
    restart: always
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/1_schema.sql
      - ./db/seed.sql:/docker-entrypoint-initdb.d/2_seed.sql

  backend:
    build:
      context: ./backend
    container_name: proyecto3_backend
    restart: always
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://proy3:secret@db:5432/tienda_db?sslmode=disable
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    container_name: proyecto3_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "8081:80"

volumes:
  postgres_data: